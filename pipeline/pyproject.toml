[project]
name = "isnad-pipeline"
version = "0.0.0"
description = "Offline data pipeline for رحلة الحديث: acquire, parse, resolve, validate, load (SPEC §8). Never runs on Workers."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.120", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["normalize", "adapters", "isnad", "resolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic letters look "ambiguous" to ruff; they are intended.

[tool.mypy]
strict = true
packages = ["normalize", "adapters", "isnad", "resolve"]

[tool.ruff.lint.per-file-ignores]
# One-off evaluation scripts whose output is recorded in docs/data-sources.md.
"evaluate/*" = ["E501", "E701", "E702", "E741", "B905", "RUF005"]
